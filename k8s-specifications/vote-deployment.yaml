apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/naomi-nwuka/voting-vote:592eaab4fe6a3f5feae486ec0f386ee16c67fe3c
        name: vote
        ports:
        - containerPort: 80
          name: vote
