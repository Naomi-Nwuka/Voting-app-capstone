name: Voting App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and scan application images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build application images locally for scanning
      - name: Build vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          load: true
          tags: voting-vote:test

      - name: Build result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          load: true
          tags: voting-result:test

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          load: true
          tags: voting-worker:test

      # Scan images for HIGH and CRITICAL vulnerabilities.
      # Ignore vulnerabilities for which no fix is available.
      - name: Scan vote image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-vote:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan result image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-result:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-worker:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # Authenticate to GitHub Container Registry on pushes to main only
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish images tagged with the commit SHA
      - name: Push vote image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voting-vote:${{ github.sha }}

      - name: Push result image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voting-result:${{ github.sha }}

      - name: Push worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voting-worker:${{ github.sha }}

