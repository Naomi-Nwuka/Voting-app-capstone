apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/naomi-nwuka/voting-result:592eaab4fe6a3f5feae486ec0f386ee16c67fe3c
        name: result
        ports:
        - containerPort: 80
          name: result
