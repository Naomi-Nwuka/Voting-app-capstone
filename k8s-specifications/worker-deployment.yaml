apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: ghcr.io/naomi-nwuka/voting-worker:592eaab4fe6a3f5feae486ec0f386ee16c67fe3c
        name: worker
